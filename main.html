<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT</title>
    <style>
       
        body, h1, h2, h3, p {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #1c1c1c; /* Dark Background */
            color: white; /* White text for contrast */
            text-align: center;
            line-height: 1.6;
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            margin-top: 50px;
            background-color: black;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.7);
        }

        .logo img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.7);
        }

        .title h2 {
            font-size: 50px;
            color: #3498db; /* Blue text */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }

        .title span {
            font-size: 40px;
            color: #f1f1f1; /* Light text */
        }

        .title .highlight {
            color: #1c9de3; 
        }
        .featurebmr {
            display: inline-block;
            padding: 10px 20px;
            background-color: darkcyan;
            color: white;
            border-radius: 15px;
            height: 60px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .chatbox {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border: 3px solid #ccc;
            border-radius: 25px;
            padding: 5px;
            background: #fff;
            margin-top: 30px;
        }
        .chatinput {
            flex: 1;
            border: none;
            padding: 10px;
            font-size: 16px;
            outline: none;
            border-radius: 20px;
        }
        .send {
            padding: 10px 15px;
            margin-left: 5px;
            font-size: 16px;
            color: #fff;
            background-color: #1c9de3;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .send:hover {
            background-color: darkcyan;
        }
        .send:active {
            background-color: darkblue;
        }
        .chat-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            flex-direction: column;
            padding-bottom: 50px;
            transform: scale(1.3);
            transform-origin: top center;
        }
        .chat-message {
            display: flex;
            margin-bottom: 20px;
            align-items: flex-start;
            animation: fadeIn 0.5s ease-out;
            transform: scale(1.0);
        }
        .chat-message.bot {
            justify-content: flex-start;
        }
        .chat-message.user {
            justify-content: flex-end;
        }
        .chat-message p {
            max-width: 60%;
            padding: 10px;
            border-radius: 10px;
            margin: 0;
            font-size: 16px;
        }
        .chat-message.bot p {
            background-color: whitesmoke;
            color: black;
        }
        .chat-message.user p {
            background-color: darkcyan;
            color: white;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }     
    </style>
</head>
<body>
    <div class="logo">
        <img src="PTlogos.png" alt="Logo">
    </div>

    <div class="title">
        <h2>
            <span class="highlight">P</span><span>t</span>
            <br>
            <span><i>An AI Bot Specializing in Fitness and Welfare!</i></span>
        </h2>
    </div>

    <div class="message">
        <h1>Welcome, How Can I Help You?</h1>
    </div>
    <br> <br>
    <div class="features">
        <a href="bmr.html"><button type="button" class="featurebmr"><b>Get BMR Score</b></button></a>
    </div>
    <br> 
    <div class="chat-container">
        <div id="chatBox"></div>
        <div class="chatbox">
            <input type="text" id="userMessage" class="chatinput" placeholder="Message">
            <button class="send" onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script> 
        document.getElementById("userMessage").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {  
                event.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const userMessageInput = document.getElementById("userMessage");
            const userMessage = userMessageInput.value.trim();
            if (userMessage === "") return;
    
            displayMessage(userMessage, "user");
    
            // Extract Maintenance Calories value and Goal (Muscle Gain / Fat Loss)
            const maintenancePattern = /Maintenance Calories:\s*(\d+\.?\d*)\s*calories\/day/i;
            const goalPattern = /(Muscle Gain|Fat Loss)/i;
            const maintenanceMatch = userMessage.match(maintenancePattern);
            const goalMatch = userMessage.match(goalPattern);
            
            if (maintenanceMatch && goalMatch) {
                const maintenanceCalories = parseFloat(maintenanceMatch[1]);
                const goal = goalMatch[1].toLowerCase(); // Convert to lowercase for consistency
    
                if (maintenanceCalories < 1500) {
                    displayMessage("Too low, maintenance calories must be above 1500", "bot");
                } else if (maintenanceCalories > 2500) {
                    displayMessage("Too much, maintenance calories must be below 2500", "bot");
                } else {
                    let dietPlan = getDietPlan(maintenanceCalories, goal);
                    displayMessage(dietPlan, "bot");
                }
    
                // Clear input field after processing Maintenance Calories
                userMessageInput.value = "";
                return;
            }
    
            try {
                // Send user message to Rasa API
                const response = await fetch('http://localhost:5005/webhooks/rest/webhook', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ "sender": "user", "message": userMessage })
                });
    
                const data = await response.json();
    
                if (data && data.length > 0) {
                    data.forEach(messageObj => {
                        if (messageObj.text) {
                            displayMessage(messageObj.text, "bot");
                        }
                    });
                } else {
                    displayMessage("I didn't quite understand that. Can you rephrase?", "bot");
                }
            } catch (error) {
                console.error("Error communicating with Rasa server:", error);
                displayMessage("Sorry, I'm having trouble connecting to the server.", "bot");
            }
    
            // Clear input field for all responses
            userMessageInput.value = "";
        }
    
        function getDietPlan(calories, goal) {
            if (goal === "muscle gain") {
                if (calories >= 1500 && calories <= 1750) {
                    return "Muscle Gain (1500-1750 cal/day): 🥩 High-protein meals, Brown rice, and Healthy fats.";
                } else if (calories >= 1751 && calories <= 2000) {
                    return "Muscle Gain (1751-2000 cal/day): 🍗 Lean meats, Whole grains, and Nuts.";
                } else if (calories >= 2001 && calories <= 2250) {
                    return "Muscle Gain (2001-2250 cal/day): 🥚 Eggs, Protein shakes, and Avocados.";
                } else if (calories >= 2251 && calories <= 2500) {
                    return "Muscle Gain (2251-2500 cal/day): 🍕 Balanced high-calorie meals, Carbs, and Protein mix.";
                }
            } else if (goal === "fat loss") {
                if (calories >= 1500 && calories <= 1750) {
                    return "Fat Loss (1500-1750 cal/day): 🥗 Lean proteins, Low-carb veggies, and Healthy fats.";
                } else if (calories >= 1751 && calories <= 2000) {
                    return "Fat Loss (1751-2000 cal/day): 🍛 Moderate carbs, Chicken, and Green vegetables.";
                } else if (calories >= 2001 && calories <= 2250) {
                    return "Fat Loss (2001-2250 cal/day): 🥑 Healthy fats, Nuts, and Lean proteins.";
                } else if (calories >= 2251 && calories <= 2500) {
                    return "Fat Loss (2251-2500 cal/day): 🍣 Balanced diet with controlled portions and Fiber-rich foods.";
                }
            }
            return "Your Maintenance Calories or goal selection is outside the recommended range.";
        }
    
        function displayMessage(message, sender) {
            const chatBox = document.getElementById("chatBox");
    
            const messageElement = document.createElement("div");
            messageElement.classList.add("chat-message", sender);
    
            const messageText = document.createElement("p");
            messageText.textContent = message;
            messageElement.appendChild(messageText);
    
            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>     
</body>
</html>
