<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - PT</title>
    <style>
    body {
        background-image: url('{{ url_for("static", filename="registerback.jpg") }}');
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
        margin: 0;
        padding: 0;
        font-size: 24px;
        font-family: "Falling Sky";
        color: white;
    }
     
    h1 { 
        font-family: Arial;
        text-align: center; 
        font-size: xx-large;
        font-weight: bolder;
    } 

    div { 
        background-color: transparent;
        max-width: 90%;
        width: 500px;
        padding: 50px;
        margin: auto;
        text-indent: 10px;
        font-size: large;
        font-weight: bold;
        text-align: center;
    }

    div img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.7);
    }

    div input {
        border-width: 4px;
        border-color: darkblue;
        padding: 5px;
        border-radius: 20px;
        width: 80%;
    }

    .button1 {
        background-color: whitesmoke;
        border-color: black;
        border-width: thick;
        border-radius: 20px;
        padding: 16px 32px;
        text-align: center;
        font-size: medium;
        display: inline-block;
        margin: 10px;
        transition-duration: 0.4s;
        cursor: pointer;
        font-family: "Falling Sky";
        font-size: 20px;
    }

    .button1:hover {
        background-color: blue;
        color: white;
    }

    a {
        color: rgb(13, 185, 242);
        text-decoration: none;
    }

    .flash-message {
        color: yellow;
        font-weight: bold;
    }
    </style>    
</head>
<body>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-message">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <center>
        <br><br>
        <div>
            <img src="{{ url_for('static', filename='newlogo.png') }}" alt="Logo">
            <h2><b>REGISTER</b></h2>
            <form action="{{ url_for('register') }}" method="post">
                <label for="username">Username: </label> 
                <input type="text" name="username" required><br><br>

                <label for="password">Password: </label> 
                <input type="password" name="password" required><br><br>

                <button type="submit" class="button1"><b>Register</b></button>
                <br><br>
                <p>Already have an account? <a href="{{ url_for('signin') }}"><b>Sign In Now</b></a></p>
            </form>
        </div>
    </center>
</body>
</html>
