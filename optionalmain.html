<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT</title>
    <style>
        .message {
            text-align: center;
        }
        .logo {
            background-image: url('/static/filmback.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            height: 300px;
            margin: auto;
            border: black;
        }
        .logo img {
            width: 150px;
            height: 150px;
            margin-right: 15px;
            border-radius: 50%;
        }
        body {
            font-family: 'Falling Sky';
        }
        .title {
            font-size: 50px;
            line-height: 100px;
            text-align: center;
            border: black;
        }
        .features {
            width: 50%;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
        }
        .featurebmr {
            display: inline-block;
            padding: 10px 20px;
            background-color: whitesmoke;
            color: orangered;
            border-radius: 15px;
            height: 60px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .chatbox {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border: 3px solid #ccc;
            border-radius: 25px;
            padding: 5px;
            background: #fff;
            margin-top: 30px;
        }
        .chatinput {
            flex: 1;
            border: none;
            padding: 10px;
            font-size: 16px;
            outline: none;
            border-radius: 20px;
        }
        .send {
            padding: 10px 15px;
            margin-left: 5px;
            font-size: 16px;
            color: #fff;
            background-color: green;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .send:hover {
            background-color: darkgreen;
        }
        .send:active {
            background-color: darkgreen;
        }
        .chat-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            flex-direction: column;
            padding-bottom: 50px;
            transform: scale(1.3);
            transform-origin: top center;
        }
        .chat-message {
            display: flex;
            margin-bottom: 20px;
            align-items: flex-start;
            animation: fadeIn 0.5s ease-out;
            transform: scale(1.0);
        }
        .chat-message.bot {
            justify-content: flex-start;
        }
        .chat-message.user {
            justify-content: flex-end;
        }
        .chat-message p {
            max-width: 60%;
            padding: 10px;
            border-radius: 10px;
            margin: 0;
            font-size: 16px;
        }
        .chat-message.bot p {
            background-color: #f1f1f1;
        }
        .chat-message.user p {
            background-color: #7cb342;
            color: white;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="/static/AdaptAvenue.png">
    </div>
    <div class="title">
        <h2>
            <span style="color: darkgreen;">P</span><span style="color: black;">T</span>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <span style="color: black; font-size: 30px;"><i>An AI Bot Specializing in </i></span>
            <span style="color: green; font-size: 30px;"><b>Fitness and Welfare!</b></span>
        </h2>
    </div>

    <br><br>
    <div class="message">
        <h1 style="font-size: 40px;">Welcome<br> How Can I Help You?</h1>
    </div>

    <center>
        <div class="features">
            <a href="bmr.html"><button type="button" class="featurebmr"><b>Get BMR Score</b></button></a>
        </div>
    </center>
    <br><br><br>

    <div class="chat-container">
        <div id="chatBox"></div>
        <div class="chatbox">
            <input type="text" id="userMessage" class="chatinput" placeholder="Message">
            <button class="send" onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        async function sendMessage() {
        const userMessage = document.getElementById("userMessage").value.trim();
        if (userMessage === "") return;

        // Display user's message
        displayMessage(userMessage, "user");

        try {
            // Send user message to Rasa API
            const response = await fetch('http://localhost:5005/webhooks/rest/webhook', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ "sender": "user", "message": userMessage })
            });

            const data = await response.json();

            // Display bot response
            if (data && data.length > 0) {
                data.forEach(messageObj => {
                    if (messageObj.text) {
                        displayMessage(messageObj.text, "bot");
                    }
                });
            } else {
                displayMessage("I didn't quite understand that. Can you rephrase?", "bot");
            }
        } catch (error) {
            console.error("Error communicating with Rasa server:", error);
            displayMessage("Sorry, I'm having trouble connecting to the server.", "bot");
        }

        // Clear the input field
        document.getElementById("userMessage").value = "";
    }

    function displayMessage(message, sender) {
        const chatBox = document.getElementById("chatBox");

        // Create message element
        const messageElement = document.createElement("div");
        messageElement.classList.add("chat-message", sender);

        // Add message text with proper HTML rendering for bot responses
        const messageText = document.createElement("p");
        if (sender === "bot") {
            messageText.innerHTML = message;  // Allows rendering of HTML in bot messages
        } else {
            messageText.textContent = message;  // Prevents HTML injection in user messages
        }
        messageElement.appendChild(messageText);

        // Append message to chat
        chatBox.appendChild(messageElement);

        // Scroll to bottom of chat box
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    </script>
</body>
</html>
